name: Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  Deploy-to-EdgeOne:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: 3. Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: 4. Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          cache: true

      - name: 5. Install EdgeOne CLI
        run: pnpm add --global edgeone@latest

      - name: 6. Link EdgeOne Project
        run: echo "${{ secrets.EDGEONE_PROJECT_NAME }}" | edgeone pages link -t ${{ secrets.EDGEONE_API_TOKEN }}

      - name: 7. Pull EdgeOne Environment Variables
        run: edgeone pages env pull -t ${{ secrets.EDGEONE_API_TOKEN }}

      - name: 8. Install dependencies
        run: pnpm install

      - name: 9. Build Project
        run: bun run build

      - name: 10. Deploy to EdgeOne Pages
        run: edgeone pages deploy .next -t ${{ secrets.EDGEONE_API_TOKEN }} -e production

name: Deploy to EdgeOne Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  Deploy-to-EdgeOne:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v6

      - name: 2. Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - name: 4. Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 5. Install EdgeOne CLI
        run: pnpm add --global edgeone@latest

      - name: 6. Create EdgeOne Project Link File
        run: |
          mkdir -p .edgeone
          echo '{"Name":"${{ secrets.EDGEONE_PROJECT_NAME }}","ProjectId":"${{ secrets.EDGEONE_PROJECT_ID }}"}' > .edgeone/project.json

      - name: 7. Pull EdgeOne Environment Variables
        run: edgeone pages env pull -t ${{ secrets.EDGEONE_API_TOKEN }}

      - name: 8. Install dependencies
        run: pnpm install

      - name: 9. Build Project
        run: bun run build

      - name: 10. Deploy to EdgeOne Pages
        run: edgeone pages deploy . -t ${{ secrets.EDGEONE_API_TOKEN }} -e production
